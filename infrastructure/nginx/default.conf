upstream frontend {
    server frontend-service:5173;
}

upstream openapi-splitter-service {
    server openapi-splitter-service:8000;
}

upstream files-service {
    server files-service:8001;
}

server {
    listen 80;
    server_name localhost;

    # Basic Auth (демо: логин admin, пароль admin — см. README)
    auth_basic "OpenAPI Splitter";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Оптимизация производительности
    aio threads;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    client_max_body_size 50M;

    # Фронт
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Files Service - все запросы к /api/v1/files/*
    location ^~ /api/v1/files {
        proxy_pass http://files-service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/v1/files;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI Splitter Service - все запросы к /api/v1/splitter/*
    location ^~ /api/v1/splitter {
        proxy_pass http://openapi-splitter-service;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /api/v1/splitter;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Оптимизация статики
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
