services:
  openapi-splitter-service:
    build:
      context: ./openapi-splitter-service
      target: development
    container_name: openapi-splitter-service
    restart: unless-stopped
    volumes:
      - ./openapi-splitter-service:/app
      - /app/node_modules
    env_file:
      - ./openapi-splitter-service/.env
    ports:
      - "8000:8000"
    depends_on:
      files-service:
        condition: service_started
    networks:
      - app-network

  files-service:
    build:
      context: ./files-service
      target: development
    container_name: files-service
    restart: unless-stopped
    volumes:
      - ./files-service:/app
      - /app/node_modules
      - files_storage:/app/storage
    env_file:
      - ./files-service/.env
    ports:
      - "8001:8001"
    depends_on:
      db-files:
        condition: service_healthy
    networks:
      - app-network

  frontend-service:
    build:
      context: ./frontend-service
      target: development
    # Порт не пробрасываем наружу - доступ только через nginx
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-service:/app
      - /app/node_modules
      - vite_cache:/tmp/.vite
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  db-files:
    image: postgres:15
    container_name: db-files
    environment:
      - POSTGRES_DB=${FILES_DB_NAME:-files_service}
      - POSTGRES_USER=${FILES_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${FILES_DB_PASSWORD:-postgres}
    ports:
      - "5434:5434"
    volumes:
      - db_files_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-service:
        condition: service_started
      openapi-splitter-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  # Мониторинг (закомментировано)
