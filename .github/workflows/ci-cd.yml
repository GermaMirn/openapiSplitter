name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

  test:
    name: Test & Coverage (95%+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test openapi-splitter-service
        run: |
          cd openapi-splitter-service
          bun install --frozen-lockfile
          bun run test:coverage

      - name: Test files-service
        run: |
          cd files-service
          bun install --frozen-lockfile
          bun run test:coverage

      - name: Test frontend-service
        run: |
          cd frontend-service
          bun install --frozen-lockfile
          bun run test:coverage
